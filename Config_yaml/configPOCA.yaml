behaviors:
  Colaboracion:
    trainer_type: poca
    max_steps: 20e6
    time_horizon: 128        
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 1000000

    hyperparameters:
      batch_size: 2048       
      buffer_size: 20480      
      learning_rate: 2.5e-4   
      beta: 1.0e-3            
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5            

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.95 
        strength: 0.05        
        learning_rate: 0.0003

env_settings:
  num_envs: 10