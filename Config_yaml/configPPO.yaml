behaviors:
  Colaboracion:
    trainer_type: ppo
    max_steps: 20e6
    time_horizon: 128         # Mayor horizonte para tareas secuenciales
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 1000000

    hyperparameters:
      batch_size: 2048         # Subo el batch para mayor estabilidad
      buffer_size: 20480       # Relación 10x->Pruebo carga GPU
      learning_rate: 2.5e-4    # Ligeramente más baja para suavizar oscilaciones
      beta: 1.0e-3             # Regularización L2 un poco más alta (más conservadora)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5             # Más épocas por batch para aprovechar mejor el buffer

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.95 # Estaba en 0.99
        strength: 0.05         # Le subo un poco la fuerza para explorar mejor
        learning_rate: 0.0003

env_settings:
  num_envs: 10   
