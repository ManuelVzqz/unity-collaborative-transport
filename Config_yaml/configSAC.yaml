behaviors:
  Colaboracion:
    trainer_type: sac
    max_steps: 30e6
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 1000000

    hyperparameters:
      batch_size: 128
      buffer_size: 50000
      learning_rate: 3e-4
      tau: 0.005
      steps_per_update: 10

    network_settings:
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

env_settings:
  num_envs: 10
